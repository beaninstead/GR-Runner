import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#0a0814"
    # Keep the HTML progress UI visible until the game is ready. Hiding it early
    # makes cold loads look permanently stuck on "Loading, please wait ...".
    platform.window.transfer.hidden = false
    platform.window.canvas.style.visibility = "visible"

    def ui(msg):
        try:
            # Prefer JS helper so load timers / phase stay in sync.
            if hasattr(platform.window, "set_load_ui"):
                platform.window.set_load_ui(msg)
            else:
                platform.window.status.innerHTML = msg
                platform.window.infobox.innerText = msg
                platform.window.show_infobox()
        except Exception:
            pass

    ui("Unpacking game...")

    bundle = "web_app"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/web_app
    appdir.mkdir()


    # itch.io HTML5 uploads must ship web_app.apk (zip). Vercel/GitHub use tar.gz.
    # Official pygbag --archive packages index.html + favicon.png + *.apk for itch.
    on_itch = platform.window.location.host.find('.itch.zone') > 0
    unpacked = False
    if on_itch:
        try:
            import zipfile
            ui("Downloading game package (apk)...")
            async with platform.fopen("web_app.apk", "rb") as archive:
                ui("Unpacking game package...")
                with zipfile.ZipFile(archive) as zip_ref:
                    zip_ref.extractall(appdir.as_posix())
            unpacked = True
        except Exception as e:
            print("itch apk unpack failed, trying tar.gz fallback:", e)
            ui(f"apk failed ({e}); trying tar.gz...")

    if not unpacked:
        import tarfile
        ui("Downloading game package (tar.gz)...")
        async with platform.fopen("web_app.tar.gz", "rb") as archive:
            ui("Unpacking game package...")
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    ui("Starting Python...")

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Tap to start Future Run"
        ui(msg)
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        # Status bar only — do not re-open the green infobox during pkg installs.
        try:
            platform.window.status.innerHTML = f"Loading {pkg}..."
        except Exception:
            pass

    # Hide load UI before main: shell.source never returns (pygame loop), so the
    # old post-source hide never ran and the 25s "Still downloading" banner
    # could reappear on top of a running game.
    try:
        platform.window.dismiss_load_ui()
    except Exception:
        try:
            platform.window.transfer.hidden = true
            platform.window.infobox.style.display = "none"
        except Exception:
            pass

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    try:
        platform.window.dismiss_load_ui()
    except Exception:
        platform.window.transfer.hidden = true
        platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

// Load UI lifecycle: "download" → "loading" → "ready".
// Timers must not re-show the green banner after the game is running.
let __fr_load_phase = "download" // download | loading | ready
let __fr_heartbeat = null
let __fr_slow_hint = null

function show_infobox() {
    if (__fr_load_phase === "ready") return;
    infobox.style.display = "block";

    // Measure box
    const w = infobox.offsetWidth;
    const h = infobox.offsetHeight;

    // Center in viewport
    const left = (window.innerWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;

    infobox.style.left = left + "px";
    infobox.style.top = top + "px";
}

function mark_load_past_download() {
    if (__fr_load_phase === "download") __fr_load_phase = "loading"
    if (__fr_heartbeat) {
        try { clearInterval(__fr_heartbeat) } catch (e) {}
        __fr_heartbeat = null
    }
    if (__fr_slow_hint) {
        try { clearTimeout(__fr_slow_hint) } catch (e) {}
        __fr_slow_hint = null
    }
}

function dismiss_load_ui() {
    __fr_load_phase = "ready"
    mark_load_past_download()
    try {
        if (transfer) transfer.hidden = true
    } catch (e) {}
    try {
        if (infobox) infobox.style.display = "none"
    } catch (e) {}
}

    <script type="application/javascript">

    globalThis.__canvas_resized = (self, ecw, ech) => {
        console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
    }

    // Game renders at 540x960 on web (half of 1080x1920 design). Itch/desktop often hosts a
    // landscape iframe; without this, CSS width/height:100% squashes sprites.
    const GAME_AR = 540 / 960; // width / height

    function fitGameCanvas() {
        const c = document.getElementById("canvas");
        if (!c) return;
        // Prefer visualViewport on mobile (accounts for browser chrome).
        const vv = window.visualViewport;
        const vw = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 1));
        const vh = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 1));
        let w, h;
        if (vw / vh > GAME_AR) {
            // Viewport wider than portrait → pillarbox (limit by height).
            h = vh;
            w = Math.max(1, Math.round(vh * GAME_AR));
        } else {
            // Viewport taller/narrower → letterbox (limit by width).
            w = vw;
            h = Math.max(1, Math.round(vw / GAME_AR));
        }
        const left = Math.max(0, Math.round((vw - w) / 2 + ((vv && vv.offsetLeft) || 0)));
        const top = Math.max(0, Math.round((vh - h) / 2 + ((vv && vv.offsetTop) || 0)));
        // !important so SDL/pygbag inline styles cannot shrink us back to buffer px.
        const set = (prop, val) => c.style.setProperty(prop, val, "important");
        set("position", "fixed");
        set("left", left + "px");
        set("top", top + "px");
        set("right", "auto");
        set("bottom", "auto");
        set("margin", "0");
        set("transform", "none");
        set("width", w + "px");
        set("height", h + "px");
        set("max-width", "none");
        set("max-height", "none");
    }

    function claimCanvasLayout() {
        try {
            if (window.config) {
                window.config.user_canvas = 1;
                window.config.user_canvas_managed = 1;
            }
        } catch (e) {}
        fitGameCanvas();
    }

    window.addEventListener("resize", claimCanvasLayout);
    window.addEventListener("orientationchange", () => setTimeout(claimCanvasLayout, 50));
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", claimCanvasLayout);
        window.visualViewport.addEventListener("scroll", claimCanvasLayout);
    }
    // Initial + delayed fits (canvas buffer size set after SDL init).
    claimCanvasLayout();
    setTimeout(claimCanvasLayout, 0);
    setTimeout(claimCanvasLayout, 100);
    setTimeout(claimCanvasLayout, 250);
    setTimeout(claimCanvasLayout, 1000);
    setInterval(claimCanvasLayout, 1500);

    function set_load_ui(msg) {
        if (__fr_load_phase === "ready") return
        if (status) status.innerHTML = msg
        if (infobox) {
            infobox.innerText = msg
            show_infobox()
        }
        const s = String(msg || "")
        if (
            s.indexOf("Unpacking") >= 0 ||
            s.indexOf("Starting Python") >= 0 ||
            s.indexOf("Tap to start") >= 0 ||
            s.indexOf("Loading ") === 0
        ) {
            mark_load_past_download()
        }
    }
    window.set_load_ui = set_load_ui

    function on_itch_host() {
        return (location.hostname || "").indexOf(".itch.zone") > 0
    }

    function expected_archive() {
        // Official pygbag itch web.zip ships *.apk; Vercel/GitHub Pages use *.tar.gz.
        return on_itch_host() ? "web_app.apk" : "web_app.tar.gz"
    }

    async function probe_url(url, label) {
        try {
            let res = await fetch(url, { method: "HEAD", cache: "no-store" })
            // Some hosts reject HEAD; ask for a single byte instead of the full ~13MB package.
            if (!res.ok || res.status === 405 || res.status === 501) {
                res = await fetch(url, {
                    method: "GET",
                    headers: { "Range": "bytes=0-0" },
                    cache: "no-store",
                })
            }
            if (!(res.ok || res.status === 206)) {
                throw new Error(label + " HTTP " + res.status)
            }
            try { res.body && res.body.cancel && res.body.cancel() } catch (e) {}
            return true
        } catch (err) {
            console.error("probe failed", url, err)
            set_load_ui("FAILED: " + label + " — " + (err && err.message ? err.message : err))
            return false
        }
    }

    function hook_progress_mirror() {
        // Mirror pygbag/emscripten setStatus into the centered infobox so mobile
        // users see % / phase instead of a static "Downloading..." bar.
        if (window.__fr_progress_hooked) return
        window.__fr_progress_hooked = true

        const start = Date.now()
        let lastPct = -1
        let sawPct = false

        function doneish(cur) {
            return (
                cur.indexOf("FAILED:") === 0 ||
                cur.indexOf("Unpacking") >= 0 ||
                cur.indexOf("Starting Python") >= 0 ||
                cur.indexOf("Tap to start") >= 0 ||
                cur.indexOf("Loading ") === 0
            )
        }

        const timer = setInterval(() => {
            try {
                if (!window.Module || !Module.setStatus) return
                if (Module.__fr_status_hooked) {
                    clearInterval(timer)
                    return
                }
                const orig = Module.setStatus.bind(Module)
                Module.setStatus = function(text) {
                    orig(text)
                    if (!text || text === "hide") {
                        // Emscripten signals download UI complete — never re-show.
                        if (text === "hide") dismiss_load_ui()
                        return
                    }
                    const m = String(text).match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/)
                    if (m) {
                        const pct = Math.min(100, Math.round((parseFloat(m[2]) / parseFloat(m[3])) * 100))
                        lastPct = pct
                        sawPct = true
                        try {
                            if (progress) {
                                progress.value = pct
                                progress.max = 100
                            }
                        } catch (e) {}
                        set_load_ui(m[1].trim() + " " + pct + "%")
                        if (pct >= 100) mark_load_past_download()
                    } else {
                        set_load_ui(String(text))
                    }
                }
                Module.__fr_status_hooked = true
                clearInterval(timer)
            } catch (e) {
                console.warn("status hook", e)
            }
        }, 200)

        // Heartbeat so iframe embeds never look frozen before % arrives.
        __fr_heartbeat = setInterval(() => {
            try {
                if (__fr_load_phase !== "download") {
                    mark_load_past_download()
                    return
                }
                const elapsed = Math.round((Date.now() - start) / 1000)
                const cur = (infobox && infobox.innerText) || ""
                if (doneish(cur) || cur.indexOf("Tap to start") >= 0) {
                    mark_load_past_download()
                    return
                }
                if (sawPct || cur.indexOf("%") >= 0) return
                set_load_ui(
                    "Downloading runtime + game package… " + elapsed +
                    "s (first open ~few MB CDN + ~2.5MB game)"
                )
            } catch (e) {}
        }, 2000)

        // If CDN/runtime never progresses, surface a useful hint (not a silent hang).
        // Only once, and only while still in the cold-download phase.
        __fr_slow_hint = setTimeout(() => {
            __fr_slow_hint = null
            try {
                if (__fr_load_phase !== "download") return
                const elapsed = Math.round((Date.now() - start) / 1000)
                const cur = (infobox && infobox.innerText) || ""
                if (doneish(cur) || sawPct || cur.indexOf("%") >= 0) {
                    mark_load_past_download()
                    return
                }
                if (window.crossOriginIsolated) {
                    set_load_ui(
                        "Still loading after " + elapsed +
                        "s. SharedArrayBuffer/COEP is ON — turn OFF itch Frame Options → SharedArrayBuffer (pygame-web CDN lacks CORP)."
                    )
                } else {
                    set_load_ui(
                        "Still downloading after " + elapsed +
                        "s (CDN runtime + ~2.5MB game). Keep this tab open; slow mobile is normal on first visit."
                    )
                }
            } catch (e) {}
        }, 25000)
    }

    async function custom_onload(debug_hidden) {
        // this is called before anything python is loaded
        // make your js customization here
        console.log(__FILE__, "custom_onload")

        pyconsole.hidden = debug_hidden
        system.hidden = debug_hidden
        // Always show download progress on cold start (mobile looks "stuck" otherwise).
        transfer.hidden = false
        info.hidden = debug_hidden
        box.hidden =  debug_hidden

        // Hook after pygbag defines window_resize so SDL resizes keep portrait letterbox.
        // Note: pygbag's addEventListener('resize', window_resize) captured the original
        // function; reassigning window.window_resize alone is not enough — also claim
        // user_canvas_managed and re-fit after pygbag's internal 100ms setTimeout.
        if (!window.__fr_resize_hooked) {
            const prev = window.window_resize
            window.window_resize = function () {
                try {
                    if (window.config) {
                        window.config.user_canvas = 1
                        window.config.user_canvas_managed = 1
                    }
                    if (typeof prev === "function") prev.apply(this, arguments)
                } finally {
                    claimCanvasLayout()
                    setTimeout(claimCanvasLayout, 120)
                }
            }
            window.__fr_resize_hooked = true
        }
        claimCanvasLayout()

        const archive = expected_archive()
        set_load_ui("Connecting to pygame-web CDN…")
        hook_progress_mirror()

        // Fail fast if the itch upload is missing the required archive name.
        // (Previous zip shipped only web_app.tar.gz; itch loader expects web_app.apk.)
        const archiveOk = await probe_url("./" + archive, archive)
        if (!archiveOk && on_itch_host() && archive === "web_app.apk") {
            // Soft hint; Python path also falls back to tar.gz if present.
            await probe_url("./web_app.tar.gz", "web_app.tar.gz (fallback)")
        } else if (archiveOk) {
            set_load_ui("Found " + archive + ". Downloading CDN runtime + game…")
        }
    }

    function custom_prerun(){
        // no python main and no (MEMFS + VFS) yet.
        console.log(__FILE__, "custom_prerun")

    }

    function custom_postrun(){
        // python main and no VFS filesystem yet.
        console.log(__FILE__, "custom_postrun")
        claimCanvasLayout()
        setTimeout(claimCanvasLayout, 120)
    }

    function debug() {
        // allow to gain access to dev tools from js console
        // but only on desktop. difficult to reach when in iframe
        python.config.debug = true

        Module.PyRun_SimpleString("shell.uptime()")
        window_resize()
    }

    function info_inline(data){
        document.getElementById("info").innerHTML = data
    }

    function info_online(url) {
        // display info about current APK
        fetch( url /*, options */)
            .then((response) => response.text())
            .then((html) => {
                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
    }

    function frame_online(url) {
        window.frames["iframe"].location = url;
    }

    </script>
